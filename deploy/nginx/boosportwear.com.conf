limit_req_zone $binary_remote_addr zone=boo_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=boo_auth:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name boosportwear.com www.boosportwear.com;
    return 301 https://boosportwear.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name 167.148.161.90;
    return 301 https://boosportwear.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.boosportwear.com;

    ssl_certificate /etc/letsencrypt/live/boosportwear.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/boosportwear.com/privkey.pem;
    return 301 https://boosportwear.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name boosportwear.com;
    server_tokens off;
    limit_req_status 429;

    ssl_certificate /etc/letsencrypt/live/boosportwear.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/boosportwear.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/boosportswear/dist;
    index index.html;
    client_max_body_size 11m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://static.cloudflareinsights.com 'nonce-$request_id'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://viacep.com.br; upgrade-insecure-requests" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    location ^~ /api/auth/ {
        limit_req zone=boo_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_hide_header X-Powered-By;
    }

    location /api/ {
        limit_req zone=boo_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_hide_header X-Powered-By;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
        expires 1y;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
